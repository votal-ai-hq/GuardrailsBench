  - - 2.0
    - \byou are \w+, (?:an? )?(?:banking|financial|helpful|ai)\b
  - - 2.0
    - \bhere (?:are|is) (?:my|the) (?:system |original |internal )?(?:prompt|instructions?|configuration|config)\b
