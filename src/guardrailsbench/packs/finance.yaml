  output_negations:
  - - -2.0
    - \bi can'?t (?:provide|give|share|disclose|recommend|advise|help with)\b
  - - -2.0
    - \bi'?m not able to\b|\bi'?m unable to\b|\bi don'?t have access to\b
  - - -2.0
