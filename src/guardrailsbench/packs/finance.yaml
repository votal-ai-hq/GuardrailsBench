  - - -1.0
    - \bconsult (?:a|your) (?:licensed |financial |tax )?(?:advisor|professional)\b
  - - -1.0
    - \bi'?d recommend checking\b|\bthat'?d be the authoritative source\b
  - - -1.0
    - \bi can'?t advise on your particular\b|\bgeneral(?:ly| terms)\b
