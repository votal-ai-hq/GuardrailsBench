name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Dataset gates
        run: python -m guardrailsbench validate --data data/test.jsonl
      - name: Unit tests
        run: pytest
      # Golden-case evals: asserts the benchmark's *results* have not drifted,
      # which the unit suite cannot see. Slower, so it runs last.
      - name: Evals
        run: python evals/run_evals.py
